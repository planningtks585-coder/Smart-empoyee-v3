<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Outer glowing badge circle -->
  <circle cx="256" cy="256" r="170" fill="#1e3a8a" fill-opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.7" stroke-dasharray="16 8" />

  <!-- Time clock ticks -->
  <line x1="256" y1="110" x2="256" y2="124" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="388" x2="256" y2="402" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="256" x2="124" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="388" y1="256" x2="402" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Central "ML" letters with shadow -->
  <g filter="url(#shadow)">
    <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">ML</text>
  </g>

  <!-- Small star badge in corner -->
  <circle cx="360" cy="150" r="28" fill="url(#goldGrad)" filter="url(#shadow)" />
  <path d="M360 134 L364 145 L376 146 L367 154 L370 166 L360 160 L350 166 L353 154 L344 146 L356 145 Z" fill="#ffffff" />
</svg>
